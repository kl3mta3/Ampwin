<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="skin.css" />
  </head>
  <body>
    <div id="root">
      <!-- title bar (window drag handle; buttons excluded) -->
      <header id="titlebar">
        <div id="logo">AMPWIN</div>
        <div id="title-scroll"><span id="title-text">welcome</span></div>
        <button id="btn-min" title="Minimize">–</button>
        <button id="btn-close" title="Close">×</button>
      </header>

      <!-- visualizer + track info -->
      <section id="main">
        <div id="viz-pane">
          <canvas id="viz" title="click: random preset · double-click: fullscreen"></canvas>
        </div>
        <div id="info-pane">
          <img id="art" alt="" hidden />
          <div id="track-title">no track</div>
          <div id="track-artist"></div>
          <div id="track-album"></div>
          <div id="track-tech"></div>
        </div>
      </section>

      <!-- transport -->
      <section id="transport">
        <div class="row">
          <button id="btn-prev" title="Previous">⏮</button>
          <button id="btn-play" title="Play/Pause">▶</button>
          <button id="btn-stop" title="Stop">⏹</button>
          <button id="btn-next" title="Next">⏭</button>
          <span id="time-pos" class="lcd">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" />
          <span id="time-dur" class="lcd">0:00</span>
        </div>
        <div class="row">
          <button id="btn-shuffle" title="Shuffle">🔀</button>
          <button id="btn-repeat" title="Repeat">🔁<sub id="repeat-mode"></sub></button>
          <button id="btn-eq" title="Equalizer">🎛 EQ</button>
          <button id="btn-mute" title="Mute">🔊</button>
          <input id="vol" type="range" min="0" max="100" value="80" title="Volume" />
          <span class="spacer"></span>
          <button id="btn-sysaudio" title="Visualize system audio — Spotify, a browser, any app">📡</button>
          <button id="btn-lyrics" title="Show lyrics over the visualizer (when the song has them)">🎤 lyrics</button>
          <select id="sel-viz" title="Visualizer"></select>
        </div>
        <div class="row">
		  <button id="btn-pl-popout" title="Pop out playlist to a window">⇱</button>
          <button id="btn-playlist-menu" title="Playlists: new, save, load, import, export">☰ playlists ▾</button>
          <span class="spacer"></span>
          <select id="sel-preset" title="MilkDrop preset"></select>
          <button id="btn-preset-rand" title="Random preset">🎲</button>
          <button id="btn-preset-cycle" title="Auto-cycle presets">cycle</button>
          <button id="btn-preset-import" title="Import Butterchurn .json presets">📥</button>
        </div>
      </section>

      <!-- playlist -->
      <section id="playlist-pane">
        <div id="pl-search-bar">
          <input id="pl-search" type="text" placeholder="🔍 filter playlist…" />
          <button id="pl-search-clear" title="Clear filter">×</button>
          <span id="pl-current" title="Current saved playlist"></span>
          <span id="pl-downloads" title="Open the downloads folder">downloads</span>
        </div>
        <div id="playlist"></div>
        <div id="playlist-actions">
          <button id="btn-add-menu" title="Add to playlist: files, folder, link">＋</button>
          <button id="btn-remove" title="Remove item from playlist">−</button>
          <button id="btn-clear" title="Clear playlist">🧹</button>
          <span class="spacer"></span>
		  <select id="sel-skin" title="Skin"></select>
          <button id="btn-addons" title="Browse &amp; manage addons">🧩 addons</button>
        </div>
      </section>
    </div>

    <!-- save-playlist inline prompt (window.prompt doesn't exist in Electron) -->
    <div id="save-modal" class="modal" hidden>
      <div class="modal-box">
        <div class="modal-title">Save playlist as</div>
        <input id="save-name" type="text" maxlength="60" placeholder="playlist name" />
        <div class="modal-actions">
          <button id="save-ok">save</button>
          <button id="save-cancel">cancel</button>
        </div>
      </div>
    </div>

    <!-- generic confirm prompt (delete / overwrite) -->
    <div id="confirm-modal" class="modal" hidden>
      <div class="modal-box" style="width: 340px">
        <div class="modal-title" id="confirm-title">Confirm</div>
        <div id="confirm-msg"></div>
        <div class="modal-actions">
          <span class="spacer"></span>
          <button id="confirm-ok">ok</button>
          <button id="confirm-cancel">cancel</button>
        </div>
      </div>
    </div>

    <!-- add-link modal -->
    <div id="link-modal" class="modal" hidden>
      <div class="modal-box" style="width: 380px">
        <div class="modal-title">Add link</div>
        <input id="link-url" type="text" placeholder="Paste a URL (YouTube, direct .mp3/.mp4, stream…)" />
        <label class="chk"><input id="link-audio" type="checkbox" /> Audio only</label>
        <div id="link-status"></div>
        <div class="modal-actions">
          <button id="link-search-btn" title="Search YouTube">🔍 search</button>
          <button id="link-signin-btn" title="Sign in to YouTube for age/region-locked videos">sign in</button>
          <span class="spacer"></span>
          <button id="link-add">add</button>
          <button id="link-cancel">cancel</button>
        </div>
      </div>
    </div>

    <!-- convert modal -->
    <div id="convert-modal" class="modal" hidden>
      <div class="modal-box" style="width: 340px">
        <div class="modal-title" id="convert-title">Convert</div>
        <div id="convert-pick">
          <select id="convert-format"></select>
        </div>
        <div id="convert-bar" hidden><div id="convert-fill"></div></div>
        <div id="convert-status"></div>
        <div class="modal-actions">
          <span class="spacer"></span>
          <button id="convert-go">convert</button>
          <button id="convert-open" hidden>open folder</button>
          <button id="convert-cancel">cancel</button>
        </div>
      </div>
    </div>

    <!-- addons browser modal -->
    <div id="addons-modal" class="modal" hidden>
      <div class="modal-box" style="width: 560px; max-height: 82%">
        <div class="modal-title">Addons</div>
        <div class="row">
          <input id="addons-filter" type="text" placeholder="🔍 filter addons…" style="flex: 1" />
          <button id="addons-refresh" title="Reload the addon repo">↻</button>
          <button id="addons-folder" title="Open the addons folder">folder</button>
        </div>
        <div id="addons-list"></div>
        <div class="modal-actions">
          <span id="addons-status" class="spacer"></span>
          <button id="addons-close">close</button>
        </div>
      </div>
    </div>

    <!-- YouTube search modal -->
    <div id="search-modal" class="modal" hidden>
      <div class="modal-box" style="width: 560px; max-height: 80%">
        <div class="modal-title">Search YouTube</div>
        <div class="row">
          <input id="search-q" type="text" placeholder="Search…" style="flex: 1" />
          <label class="chk"><input id="search-audio" type="checkbox" /> audio only</label>
          <button id="search-go">go</button>
        </div>
        <div id="search-results"></div>
        <div class="modal-actions">
          <span id="search-status" class="spacer"></span>
          <button id="search-close">close</button>
        </div>
      </div>
    </div>

    <script src="skin.js"></script>
  </body>
</html>
