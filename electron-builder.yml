appId: com.ampwin.player
productName: Ampwin
directories:
  # Build into a scratch folder that nothing runs from. Windows Defender /
  # SearchIndexer keep a persistent handle on the app.asar of whatever
  # win-unpacked the app was last launched from, which made rebuilding into the
  # delivery folder fail (EBUSY). build.cmd copies the finished installers out
  # of here into dist-installer and launches the portable (runs from %TEMP%).
  output: dist-build
  buildResources: build
files:
  - out/**
extraResources:
  - from: skins
    to: skins
  - from: node_modules/ffmpeg-static/ffmpeg.exe
    to: bin/ffmpeg.exe
  - from: node_modules/ffprobe-static/bin/win32/x64/ffprobe.exe
    to: bin/ffprobe.exe
  # yt-dlp.exe is fetched into build/bin by scripts/fetch-ytdlp.mjs (run as part
  # of `npm run dist`). If the fetch was skipped/offline, this copies only the
  # .gitkeep and the app downloads yt-dlp at runtime instead.
  - from: build/bin
    to: bin
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.png
portable:
  artifactName: ${productName}-${version}-portable.exe
fileAssociations:
  - ext: mp3
    name: MP3 Audio
  - ext: flac
    name: FLAC Audio
  - ext: ogg
    name: Ogg Vorbis Audio
  - ext: opus
    name: Opus Audio
  - ext: m4a
    name: MPEG-4 Audio
  - ext: wav
    name: WAV Audio
  - ext: wma
    name: Windows Media Audio
  - ext: m3u
    name: M3U Playlist
  - ext: m3u8
    name: M3U8 Playlist
  - ext: pls
    name: PLS Playlist
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
